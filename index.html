<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="MaxiFox – משחק הכסף שעובד בשבילך. בונים הכנסה פסיבית ומגיעים לחופש כלכלי">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MaxiFox – משחק הכסף שעובד בשבילך</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <style>
    /* Critical paint: navy backdrop before CSS loads (no flash) */
    html, body { margin: 0; background: #0F172A; }
    #app:empty { min-height: 100dvh; background: #0F172A; }
    /* splash (fox-usage.md: the MaxiFox logo while the app loads); main.js removes it once the first screen is mounted */
    #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #0F172A; z-index: 1; pointer-events: none; }
    #splash img { width: 200px; height: auto; aspect-ratio: 240 / 261; }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="/src/assets/brand/maxifox-logo-alpha-1x.webp" srcset="/src/assets/brand/maxifox-logo-alpha-1x.webp 1x, /src/assets/brand/maxifox-logo-alpha-2x.webp 2x" width="200" height="218" alt="" fetchpriority="high"></div>
  <main id="app"></main>
  <div id="modal-root"></div>
  <div id="fx-layer" aria-hidden="true"></div>
  <div id="toast-layer"></div>
  <noscript>MaxiFox דורש JavaScript</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
