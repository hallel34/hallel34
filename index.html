<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="MaxiFox – משחק הכסף שעובד בשבילך. בונים הכנסה פסיבית ומגיעים לחופש כלכלי">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MaxiFox – משחק הכסף שעובד בשבילך</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <style>
    /* Critical paint: navy backdrop before CSS loads (no flash) */
    html, body { margin: 0; background: #0F172A; }
    #app:empty { min-height: 100dvh; background: #0F172A; }
  </style>
</head>
<body>
  <main id="app"></main>
  <div id="modal-root"></div>
  <div id="fx-layer" aria-hidden="true"></div>
  <div id="toast-layer"></div>
  <noscript>MaxiFox דורש JavaScript</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
