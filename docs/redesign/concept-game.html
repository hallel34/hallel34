<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MaxiFox concept: active game (visual direction only, not shipped code)</title>
<!-- ?cap=12 shows the short-game variant (round badge + non-zero progress, ILLUSTRATIVE figures: salary 8,800 + passive 1,200 - expenses 7,310 = +2,690). Default = Family, 1 player, unlimited, teacher, first roll (real initial values). -->
<link rel="stylesheet" href="../../src/styles/fonts.css">
<link rel="stylesheet" href="tokens.proposed.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-display);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
.screen{height:100dvh;max-width:480px;margin-inline:auto;padding:10px 8px 14px;display:flex;flex-direction:column;gap:8px;position:relative;isolation:isolate;
  background:radial-gradient(90% 40% at 50% 46%,#16264A 0%,rgb(11 18 36 / 0) 70%),var(--bg)}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
/* ---------- HUD ---------- */
.hud{flex:none;border-radius:20px;padding:var(--hud-pad) 10px var(--hud-pad);background:linear-gradient(180deg,#16213C,var(--bg-2));border:1px solid var(--mf-border);box-shadow:var(--elev-2);display:flex;flex-direction:column;gap:4px}
.rowA{display:flex;align-items:center;gap:10px;min-block-size:var(--hud-row)}
.avatar{position:relative;flex:none;inline-size:44px;block-size:44px}
.avatar img{inline-size:44px;block-size:44px;border-radius:50%;border:2px solid var(--mf-fox);background:var(--mf-elev);object-fit:cover;box-shadow:0 2px 6px rgb(0 0 0 / .4)}
.round[hidden]{display:none}
.round{position:absolute;inset-inline-end:-8px;inset-block-end:-5px;min-inline-size:36px;block-size:20px;padding-inline:6px;border-radius:10px;display:grid;place-items:center;background:var(--bg);border:1.5px solid var(--mf-gold);font:700 .75rem/1 var(--font-display);color:var(--text);box-shadow:0 2px 4px rgb(0 0 0 / .4)}
.who{flex:1;min-inline-size:0;display:flex;flex-direction:column;gap:1px}
.who b{font:700 .9375rem/1.2 var(--font-display);overflow-wrap:anywhere}
.who span{font:500 var(--fs-caption)/1.3 var(--font-display);color:var(--text-muted)}
.tools{display:flex;flex:none;margin-inline-end:-6px}
.ibtn{position:relative;inline-size:var(--tap);block-size:var(--tap);display:grid;place-items:center;background:none;border:0;color:var(--text);padding:0;touch-action:manipulation;margin-block:-2px}
.ibtn::before{content:"";position:absolute;inset:4px;border-radius:50%;background:rgb(255 255 255 / .06);border:1px solid var(--mf-border)}
.ibtn:active::before{background:rgb(255 255 255 / .14);transform:scale(.94)}
.ibtn svg{position:relative;inline-size:22px;block-size:22px}
.rowB{display:flex;align-items:center;gap:10px;min-block-size:40px}
.cash{flex:1;min-inline-size:0;display:flex;align-items:baseline;gap:8px}
.cash .coin{align-self:center;inline-size:24px;block-size:24px;flex:none}
.cash .amt{font:900 var(--fs-money-hud)/1.1 var(--font-display);letter-spacing:-.01em}
.cash .amt small{font-size:.62em;font-weight:700;margin-inline-end:2px;opacity:.85}
.cash .lbl{font:500 var(--fs-caption)/1 var(--font-display);color:var(--text-muted)}
.flow{position:relative;flex:none;block-size:40px;display:flex;align-items:center;gap:6px;padding-inline:10px 8px;border-radius:14px;color:var(--mf-success);font-family:inherit;
  background:rgb(72 201 154 / .13);border:1px solid rgb(72 201 154 / .45);touch-action:manipulation}
.flow::before{content:"";position:absolute;inset-block:-4px;inset-inline:-2px}
.flow .t{display:flex;flex-direction:column;align-items:start;gap:0;line-height:1.1}
.flow .v{font:900 1rem/1.1 var(--font-display)}
.flow .u{font:500 var(--fs-caption)/1.1 var(--font-display);color:var(--text-muted)}
.flow svg{inline-size:16px;block-size:16px}
.prog{display:flex;flex-direction:column;gap:4px}
.track{position:relative;block-size:8px;border-radius:4px;background:rgb(255 255 255 / .10);overflow:hidden}
.track i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:4px;background:linear-gradient(90deg,#2FBF9C,var(--passive))}
.track b{position:absolute;inset-block:0;inline-size:2px;background:rgb(11 18 36 / .75)}
.pline{display:flex;align-items:baseline;gap:5px;font:500 var(--fs-label)/1.2 var(--font-display);color:var(--text-muted);white-space:nowrap}
.pline .v{font-weight:700;color:var(--text)}
.pline .v.pass{color:var(--mf-success)}
.pline .pct{margin-inline-start:auto;font-weight:700;color:var(--text)}
.cap{font:500 var(--fs-caption)/1.2 var(--font-display);color:var(--text-muted);margin-block-start:-1px}
@media (max-height:700px){.tiprow{min-block-size:56px}.fox{inline-size:52px;block-size:52px}.bubble{font-size:.8125rem;line-height:1.3}}
@media (max-width:340px){.cash .coin{display:none}.cash .amt{font-size:1.75rem}.flow>svg:last-child{display:none}.flow{padding-inline:8px}.who b{font-size:.875rem}}
/* ---------- board ---------- */
.stage{flex:1;min-block-size:0;display:flex;align-items:center;justify-content:center;padding-block:2px}
.board{position:relative;max-inline-size:100%;block-size:100%;max-block-size:353px;aspect-ratio:1.0602;background:url(concept-assets/board-pieces-85pct-candidate.webp) center/100% 100% no-repeat;filter:drop-shadow(0 18px 26px rgb(0 0 0 / .5))}
.ring{position:absolute;inline-size:12.4%;block-size:10.4%;translate:-50% -50%;border:2px solid #FFE099;border-radius:9px;box-shadow:0 0 0 3px rgb(11 18 36 / .8),0 0 14px rgb(245 185 54 / .5)}
.pawn{position:absolute;inline-size:var(--pawn-w);translate:-50% -72%;filter:drop-shadow(0 3px 2px rgb(0 0 0 / .45))}
.centerp{position:absolute;inset-inline:26%;inset-block:21% 21%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.die{inline-size:var(--die-idle);block-size:var(--die-idle);filter:drop-shadow(0 6px 4px rgb(0 0 0 / .5))}
.here{display:inline-flex;align-items:center;gap:6px;font:700 .8125rem/1.3 var(--font-display);color:#FFD479}
.here svg{inline-size:18px;block-size:18px;flex:none}
.turnnote{font:500 var(--fs-caption)/1.3 var(--font-display);color:var(--text-muted)}
/* ---------- fox tip + CTA ---------- */
.dock{flex:none;display:flex;flex-direction:column;gap:10px}
.tiprow{display:flex;align-items:center;gap:10px;min-block-size:64px}
.bubble{position:relative;flex:1;min-inline-size:0;display:flex;align-items:center;gap:6px;padding:8px 4px 8px 12px;border-radius:18px;background:linear-gradient(180deg,rgb(36 52 80 / .96),rgb(27 41 69 / .96));border:1px solid rgb(255 255 255 / .16);box-shadow:var(--elev-2);font:500 .875rem/1.4 var(--font-display);color:var(--text)}
.bubble::after{content:"";position:absolute;inset-inline-end:-7px;inset-block-start:50%;inline-size:14px;block-size:14px;translate:0 -50%;rotate:45deg;background:#243350;border-block-start:1px solid rgb(255 255 255 / .16);border-inline-end:1px solid rgb(255 255 255 / .16);border-end-end-radius:3px;clip-path:polygon(0 0,100% 0,100% 100%)}
.bubble p{flex:1}
.bubble .x{flex:none;inline-size:var(--tap);block-size:var(--tap);display:grid;place-items:center;background:none;border:0;color:var(--text-muted);margin-block:-8px}
.bubble .x svg{inline-size:20px;block-size:20px}
.fox{position:relative;flex:none;inline-size:60px;block-size:60px;border-radius:50%;padding:0;border:2px solid var(--mf-gold);overflow:hidden;background:var(--mf-elev);box-shadow:var(--elev-2),0 0 0 4px rgb(245 185 54 / .12)}
.fox img{inline-size:100%;block-size:100%;object-fit:cover;display:block}
.roll{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;inline-size:100%;block-size:var(--btn-h);border:0;border-radius:var(--r-card);font:900 1.25rem/1 var(--font-display);color:var(--mf-gold-ink);
  background:linear-gradient(180deg,#FFCB57 0%,#F5B936 100%);box-shadow:var(--elev-cta);touch-action:manipulation}
.roll svg{inline-size:28px;block-size:28px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-help" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.1"/></g></symbol>
  <symbol id="i-stmt" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/></g></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V6M6 11.5l6-6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-payday" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="18" height="11" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 10v4M17.5 10v4"/></g></symbol>
  <!-- monochrome OUTLINE die glyph for the button: static, never shows a result (the only result-bearing die is on the board) -->
  <symbol id="i-dieglyph" viewBox="0 0 28 28"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="4" y="4" width="20" height="20" rx="5.5"/></g><g fill="currentColor"><circle cx="10.5" cy="10.5" r="1.7"/><circle cx="17.5" cy="17.5" r="1.7"/><circle cx="14" cy="14" r="1.7"/></g></symbol>
</svg>

<main class="screen" data-screen="board" id="scr">
  <header class="hud" id="hud">
    <div class="rowA">
      <div class="avatar"><img src="../../src/assets/profession-fox/teacher-head@2x.webp" alt="" width="88" height="88"><span class="round num" id="round" hidden aria-label="סיבוב 1 מתוך 12">1/12</span></div>
      <div class="who"><b>מורה</b><span id="turn">התור שלכם</span></div>
      <div class="tools">
        <button class="ibtn" type="button" aria-label="מקרא המשבצות" aria-haspopup="dialog"><svg><use href="#i-help"/></svg></button>
        <button class="ibtn" type="button" aria-label="דוח הכנסות והוצאות"><svg><use href="#i-stmt"/></svg></button>
        <button class="ibtn" type="button" aria-label="תפריט" aria-haspopup="dialog"><svg><use href="#i-menu"/></svg></button>
      </div>
    </div>
    <div class="rowB">
      <div class="cash"><img class="coin" src="../../src/assets/coin-small.svg" alt=""><span class="lbl">מזומן</span><bdi class="amt num" id="cash"><small>₪</small>9,000</bdi></div>
      <button class="flow" type="button" aria-expanded="false" aria-haspopup="true" aria-label="נשאר בחודש +₪1,490">
        <svg><use href="#i-up"/></svg>
        <span class="t"><bdi class="v num" id="flow">+₪1,490</bdi><span class="u">נשאר בחודש</span></span>
        <svg style="color:var(--text-muted)"><use href="#i-chev"/></svg>
      </button>
    </div>
    <div class="prog">
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="כסף שעובד מול ההוצאות"><i id="fill" style="inline-size:0%"></i><b style="inset-inline-start:25%"></b><b style="inset-inline-start:50%"></b><b style="inset-inline-start:75%"></b></div>
      <p class="pline"><span>כסף שעובד</span><bdi class="v pass num" id="passive">₪0</bdi><span>מתוך הוצאות</span><bdi class="v num" id="exp">₪7,310</bdi><bdi class="pct num" id="pct">0%</bdi></p>
      <p class="cap" id="cap">המטרה: שהכסף שעובד בשבילכם יהיה גדול מההוצאות</p>
    </div>
  </header>

  <section class="stage">
    <div class="board" role="group" aria-label="לוח המשחק">
      <div class="ring" style="inset-inline-start:auto;left:25.27%;top:10.97%"></div>
      <img class="pawn" src="../../src/assets/pawn.svg" alt="" style="left:25.27%;top:10.97%" width="26" height="29">
      <div class="centerp">
        <img class="die" src="../../src/assets/die-1.svg" alt="" width="38" height="38">
        <p class="here"><svg><use href="#i-payday"/></svg>אתם על: סיכום שנתי</p>
      </div>
    </div>
  </section>

  <footer class="dock">
    <div class="tiprow" id="tip">
      <div class="bubble"><p>חפשו על הלוח את משבצת סיכום שנתי — שם הכסף מגיע.</p><button class="x" type="button" aria-label="סגירת הרמז"><svg><use href="#i-x"/></svg></button></div>
      <button class="fox" type="button" aria-label="ההודעה האחרונה של מקסי"><img src="../../src/assets/fox/think.webp" alt="" width="512" height="512"></button>
    </div>
    <button class="roll" type="button"><svg><use href="#i-dieglyph"/></svg><span>הטילו קובייה</span></button>
  </footer>
</main>
<script>
// concept-only: the short-game variant
const q=new URLSearchParams(location.search);
if(q.get('cap')){
  const r=document.getElementById('round'); r.hidden=false; r.textContent='5/12'; r.setAttribute('aria-label','סיבוב 5 מתוך 12');
  document.getElementById('turn').textContent='התור שלכם';
  document.getElementById('cash').innerHTML='<small>₪</small>11,250';
  document.getElementById('flow').textContent='+₪2,690';
  document.getElementById('passive').textContent='₪1,200'; document.getElementById('pct').textContent='16%';
  document.getElementById('fill').style.inlineSize='16.4%';
  document.getElementById('cap').remove();
}
</script>
</body>
</html>
