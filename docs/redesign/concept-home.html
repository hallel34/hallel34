<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MaxiFox concept: home (visual direction only, not shipped code)</title>
<link rel="stylesheet" href="../../src/styles/fonts.css">
<link rel="stylesheet" href="tokens.proposed.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-display);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
.screen{position:relative;height:100dvh;max-width:480px;margin-inline:auto;padding:12px var(--gutter) 16px;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(120% 60% at 50% 22%,#16264A 0%,rgb(11 18 36 / 0) 62%),linear-gradient(180deg,#0B1224 0%,#0E1730 60%,#0B1224 100%);overflow:hidden;isolation:isolate}
.sky{position:absolute;inset:0;z-index:-1;pointer-events:none}
.sky i{position:absolute;border-radius:50%;background:#fff;opacity:.7}
.skyline{position:absolute;inset-inline:0;bottom:0;height:150px;z-index:-1;opacity:.5}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;min-block-size:var(--tap)}
.top-start{display:flex;gap:8px}
.ibtn{position:relative;inline-size:var(--tap);block-size:var(--tap);display:grid;place-items:center;background:none;border:0;color:var(--text);padding:0;touch-action:manipulation}
.ibtn::before{content:"";position:absolute;inset:4px;border-radius:50%;background:rgb(255 255 255 / .06);border:1px solid var(--mf-border);box-shadow:var(--elev-1);transition:transform var(--dur-press) var(--ease-out),background var(--dur-press)}
.ibtn:active::before{transform:scale(.94);background:rgb(255 255 255 / .12)}
.ibtn svg{position:relative;inline-size:22px;block-size:22px}
.ibtn:focus-visible{outline:var(--focus-width) solid var(--focus-ring);outline-offset:-2px;border-radius:50%}
.more{position:relative;block-size:var(--tap);display:inline-flex;align-items:center;gap:8px;padding-inline:14px 12px;border-radius:var(--r-pill);color:var(--text);font:700 .875rem/1 var(--font-display);background:none;border:0}
.more::before{content:"";position:absolute;inset-block:4px;inset-inline:0;border-radius:var(--r-pill);background:rgb(255 255 255 / .06);border:1px solid var(--mf-border);box-shadow:var(--elev-1)}
.more>*{position:relative}
.more svg{inline-size:20px;block-size:20px;color:var(--mf-gold)}
/* hero */
.hero{flex:1 1 auto;min-block-size:0;overflow:visible;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0;padding-block:4px 0}
.emblem{position:relative;inline-size:clamp(112px,25dvh,212px);aspect-ratio:480/416;display:grid;place-items:center}
.emblem::before{content:"";position:absolute;inset:-34%;background:radial-gradient(closest-side,rgb(245 185 54 / .26),rgb(245 185 54 / .07) 55%,rgb(245 185 54 / 0));z-index:-1}
.emblem img{inline-size:100%;block-size:100%;object-fit:contain;filter:drop-shadow(0 10px 18px rgb(0 0 0 / .45))}
.wordmark{margin-block-start:clamp(-30px,-3.5dvh,-16px);position:relative;font:900 var(--fs-wordmark)/1 var(--font-display);letter-spacing:-.01em;direction:ltr;unicode-bidi:isolate;
  background:var(--wordmark-grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:var(--wordmark-fx);padding-inline:4px}
.tagline{margin-block-start:10px;max-inline-size:300px;font:500 .9375rem/1.45 var(--font-display);color:#F3DDB0}
@media (max-height:640px){.tagline{display:none}.m-sub{display:none}.mode{min-block-size:0}.screen{gap:8px}}
@media (max-width:340px){:root{--fs-wordmark:2.5rem}.mode-desc{font-size:.75rem}}
/* bottom stack */
.stack{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{position:relative;text-align:start;color:var(--text);border-radius:var(--r-card);padding:12px 12px 12px;min-block-size:92px;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(180deg,var(--surface),#162340);border:1px solid var(--mf-border);box-shadow:var(--elev-1);font-family:inherit;touch-action:manipulation;
  transition:transform var(--dur-press) var(--ease-out),border-color var(--dur-fast)}
.mode:active{transform:scale(.97)}
.mode-head{display:flex;align-items:center;gap:10px}
.mode-ico{inline-size:36px;block-size:36px;border-radius:12px;display:grid;place-items:center;background:rgb(255 255 255 / .06);color:var(--text-muted);flex:none}
.mode-ico svg{inline-size:22px;block-size:22px}
.mode-name{font:700 var(--fs-title)/1.2 var(--font-display)}
.mode-desc{font:400 var(--fs-label)/1.35 var(--font-display);color:var(--text-muted)}
.mode-check{position:absolute;inset-block-start:-8px;inset-inline-end:-6px;inline-size:24px;block-size:24px;border-radius:50%;display:none;place-items:center;background:var(--mf-gold);color:var(--mf-gold-ink);box-shadow:0 2px 6px rgb(0 0 0 / .45);border:2px solid var(--bg)}
.mode-check svg{inline-size:14px;block-size:14px}
.mode[aria-pressed="true"]{border:2px solid var(--mf-gold);padding:11px 11px 11px;background:linear-gradient(180deg,rgb(245 185 54 / .14),rgb(245 185 54 / .04)),var(--surface);box-shadow:var(--elev-1),0 0 0 4px rgb(245 185 54 / .10)}
.mode[aria-pressed="true"] .mode-ico{background:var(--mf-gold);color:var(--mf-gold-ink)}
.mode[aria-pressed="true"] .mode-check{display:grid}
/* daily */
.daily{display:flex;align-items:center;gap:12px;min-block-size:64px;padding:10px 14px;border-radius:var(--r-card);text-align:start;color:var(--text);font-family:inherit;
  background:linear-gradient(90deg,var(--surface),#1F2F4F);border:1px solid var(--mf-border);box-shadow:var(--elev-1);position:relative;overflow:hidden}
.daily::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;inline-size:4px;background:var(--mf-gold)}
.daily-ico{flex:none;inline-size:40px;block-size:40px;border-radius:50%;display:grid;place-items:center;color:var(--mf-gold);background:rgb(245 185 54 / .12);border:1.5px solid rgb(245 185 54 / .55)}
.daily-ico svg{inline-size:22px;block-size:22px}
.daily-text{flex:1;min-inline-size:0;display:flex;flex-direction:column;gap:2px}
.daily-title{font:700 1rem/1.2 var(--font-display)}
.daily-status{font:500 var(--fs-label)/1.3 var(--font-display);color:var(--text-muted)}
.fwd{flex:none;inline-size:22px;block-size:22px;color:var(--text-muted)}
/* missions */
.missions{display:flex;align-items:center;gap:12px;min-block-size:56px;padding:8px 14px;border-radius:var(--r-card);color:var(--text);font-family:inherit;text-align:start;
  background:var(--bg-2);border:1px solid var(--mf-border);box-shadow:var(--elev-1)}
.m-text{flex:1;min-inline-size:0;display:flex;flex-direction:column;gap:2px}
.m-title{font:700 .9375rem/1.2 var(--font-display)}
.m-sub{font:400 var(--fs-caption)/1.3 var(--font-display);color:var(--text-muted)}
.steps{display:flex;gap:6px;flex:none}
.steps i{inline-size:10px;block-size:10px;border-radius:50%;border:2px solid var(--text-muted);display:block}
/* CTA */
.cta{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;inline-size:100%;block-size:var(--btn-h);border:0;border-radius:var(--r-card);cursor:pointer;
  font:900 1.25rem/1 var(--font-display);color:var(--mf-gold-ink);background:linear-gradient(180deg,#FFCB57 0%,#F5B936 100%);box-shadow:var(--elev-cta);touch-action:manipulation;
  transition:transform var(--dur-press) var(--ease-out),box-shadow var(--dur-press)}
.cta:active{transform:translateY(2px) scale(.985);box-shadow:var(--elev-cta-pressed)}
.cta svg{inline-size:24px;block-size:24px;transition:transform var(--dur-fast) var(--ease-out)}
.cta:active svg{transform:translateX(-4px)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></g></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.1"/></g></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></g></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <!-- forward in Hebrew = LEFT-pointing chevron (this is the raw path; no RTL mirroring on forward affordances) -->
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-family" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5L12 4l8.5 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M12 17.2s-3-1.8-3-3.9a1.7 1.7 0 0 1 3-1 1.7 1.7 0 0 1 3 1c0 2.1-3 3.9-3 3.9z"/></g></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5h16"/><path d="M6.5 16v-4M12 16V8M17.5 16v-6"/><path d="M5 8l4.5-3 3.5 2.5 5.5-3.5"/></g></symbol>
</svg>

<main class="screen" data-screen="start">
  <div class="sky" aria-hidden="true">
    <i style="inset-inline-start:9%;top:7%;inline-size:2px;block-size:2px"></i><i style="inset-inline-start:30%;top:4.5%;inline-size:1.5px;block-size:1.5px;opacity:.5"></i>
    <i style="inset-inline-start:62%;top:9%;inline-size:2.5px;block-size:2.5px"></i><i style="inset-inline-start:84%;top:5%;inline-size:2px;block-size:2px;opacity:.6"></i>
    <i style="inset-inline-start:18%;top:17%;inline-size:1.5px;block-size:1.5px;opacity:.5"></i><i style="inset-inline-start:92%;top:19%;inline-size:1.5px;block-size:1.5px;opacity:.6"></i>
  </div>
  <svg class="skyline" aria-hidden="true" viewBox="0 0 360 150" preserveAspectRatio="xMidYMax slice"><g fill="#0A1020"><rect x="0" y="50" width="32" height="100"/><rect x="36" y="20" width="24" height="130"/><rect x="64" y="64" width="38" height="86"/><rect x="106" y="2" width="28" height="148"/><rect x="138" y="56" width="34" height="94"/><rect x="176" y="36" width="22" height="114"/><rect x="202" y="68" width="40" height="82"/><rect x="246" y="10" width="26" height="140"/><rect x="276" y="60" width="36" height="90"/><rect x="316" y="28" width="44" height="122"/></g><g fill="#F5B936" opacity=".75"><rect x="42" y="32" width="4" height="5"/><rect x="112" y="16" width="4" height="5"/><rect x="252" y="24" width="4" height="5"/><rect x="326" y="42" width="4" height="5"/></g></svg>

  <header class="top">
    <div class="top-start">
      <button class="ibtn" type="button" aria-label="הגדרות"><svg><use href="#i-gear"/></svg></button>
      <button class="ibtn" type="button" aria-label="איך משחקים"><svg><use href="#i-help"/></svg></button>
    </div>
    <!-- consolidated: dictionary + weekly family board (+ finished-games count when > 0; hidden for a new player) -->
    <button class="more" type="button" aria-haspopup="dialog" aria-label="עוד: המילון של מקסי וטבלת המשפחה"><svg><use href="#i-more"/></svg><span>עוד</span></button>
  </header>

  <section class="hero">
    <div class="emblem"><img src="concept-assets/maxifox-emblem-2x.webp" alt="" width="480" height="416"></div>
    <h1 class="wordmark">MaxiFox</h1>
    <p class="tagline">הכסף עובד בשבילכם. אתם רק צריכים להתחיל.</p>
  </section>

  <div class="stack">
    <div class="modes" role="group" aria-label="בחרו מצב משחק">
      <button class="mode" type="button" aria-pressed="true">
        <span class="mode-check"><svg width="14" height="14"><use href="#i-check"/></svg></span>
        <span class="mode-head"><span class="mode-ico"><svg><use href="#i-family"/></svg></span><span class="mode-name">משפחה</span></span>
        <span class="mode-desc">מגיל 9 · דירות ועסקים</span>
      </button>
      <button class="mode" type="button" aria-pressed="false">
        <span class="mode-check"><svg width="14" height="14"><use href="#i-check"/></svg></span>
        <span class="mode-head"><span class="mode-ico"><svg><use href="#i-chart"/></svg></span><span class="mode-name">מלא</span></span>
        <span class="mode-desc">מניות, מכירה והלוואות</span>
      </button>
    </div>

    <button class="daily" type="button">
      <span class="daily-ico"><svg><use href="#i-star"/></svg></span>
      <span class="daily-text"><span class="daily-title">אתגר יומי · 15.11</span><span class="daily-status">לא שוחק היום</span></span>
      <svg class="fwd"><use href="#i-fwd"/></svg>
    </button>

    <button class="missions" type="button">
      <span class="m-text"><span class="m-title">משימות קצרות · בוחרים ומתרגלים</span><span class="m-sub">0 מתוך 3 תורגלו</span></span>
      <span class="steps" aria-hidden="true"><i></i><i></i><i></i></span>
      <svg class="fwd"><use href="#i-fwd"/></svg>
    </button>

    <button class="cta" type="button"><span>התחילו משחק</span><svg><use href="#i-fwd"/></svg></button>
  </div>
</main>
</body>
</html>
