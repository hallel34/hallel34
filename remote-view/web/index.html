<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>צפייה מרחוק</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}
#login{max-width:320px;margin:15vh auto;padding:16px;display:flex;flex-direction:column;gap:12px}
input,button{font-size:18px;padding:12px;border-radius:8px;border:0}
button{background:#2f7df6;color:#fff}
#err{color:#f66;min-height:1.2em}
#screen{display:none;width:100vw;height:100vh;object-fit:contain;touch-action:none}
#bar{display:none;position:fixed;top:0;left:0;right:0;padding:6px;background:#000a;gap:8px}
#bar button{padding:6px 12px;font-size:14px}
</style></head><body>
<div id="login">
  <h2>התחברות למחשב</h2>
  <input id="code" inputmode="numeric" placeholder="קוד (9 ספרות)">
  <input id="pw" inputmode="numeric" placeholder="סיסמה">
  <button onclick="connect()">התחבר</button><div id="err"></div>
</div>
<div id="bar"><button onclick="kb()">⌨ מקלדת</button><button onclick="send({type:'click',x:last.x,y:last.y,button:'right'})">קליק ימני</button></div>
<canvas id="screen"></canvas>
<script>
const $=id=>document.getElementById(id), cv=$('screen'), ctx=cv.getContext('2d');
let ws,last={x:.5,y:.5};
const send=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
function connect(){
  ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws/view');
  ws.binaryType='blob';
  ws.onopen=()=>ws.send(JSON.stringify({code:$('code').value,password:$('pw').value}));
  ws.onmessage=async e=>{
    if(typeof e.data=='string'){
      const m=JSON.parse(e.data);
      if(m.type=='error')$('err').textContent=m.message;
      if(m.type=='ok'){$('login').style.display='none';cv.style.display='block';$('bar').style.display='flex';}
      return;
    }
    const bmp=await createImageBitmap(e.data);
    if(cv.width!=bmp.width){cv.width=bmp.width;cv.height=bmp.height}
    ctx.drawImage(bmp,0,0);
  };
  ws.onclose=()=>{location.reload()};
}
function pos(t){const r=cv.getBoundingClientRect(),s=Math.min(r.width/cv.width,r.height/cv.height),
  w=cv.width*s,h=cv.height*s,ox=r.left+(r.width-w)/2,oy=r.top+(r.height-h)/2;
  return{x:Math.min(1,Math.max(0,(t.clientX-ox)/w)),y:Math.min(1,Math.max(0,(t.clientY-oy)/h))}}
let down=null,moved=false,sy=0;
cv.addEventListener('touchstart',e=>{down=e.touches[0];moved=false;sy=down.clientY;e.preventDefault()});
cv.addEventListener('touchmove',e=>{
  const t=e.touches[0];
  if(e.touches.length==2){send({type:'scroll',dy:Math.round((sy-t.clientY)/10)});sy=t.clientY;moved=true;}
  else{last=pos(t);send({type:'move',...last});moved=true}
  e.preventDefault()});
cv.addEventListener('touchend',e=>{if(!moved&&down){last=pos(down);send({type:'click',...last,button:'left'})}});
cv.addEventListener('mousedown',e=>{last=pos(e);send({type:'click',...last,button:e.button==2?'right':'left'})});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function kb(){const t=prompt('הקלד טקסט לשליחה (או key:enter / key:backspace)');
  if(!t)return; t.startsWith('key:')?send({type:'key',key:t.slice(4)}):send({type:'text',text:t})}
</script></body></html>
