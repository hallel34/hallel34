function fox() {

  const blaze = S(new THREE.Mesh(new THREE.SphereGeometry(0.3, 28, 20), cream)); blaze.scale.set(1.15, 0.8, 0.75); blaze.position.set(0, 1.0, 0.3); g.add(blaze);

const PIECES = { bars, bolt, heart, payday, baby, house, die, fox, taxquiz };

/* ---------- board ---------- */
const BOARD = [
  'payday', 'opportunity', 'expense', 'market', 'payday', 'opportunity',
  'charity', 'payday', 'opportunity', 'baby', 'payday', 'opportunity',
  'taxquiz', 'opportunity', 'opportunity', 'market', 'charity', 'payday',
  'opportunity', 'expense', 'market', 'baby', 'opportunity', 'opportunity',
];
const PIECE_FILE = { opportunity: 'house', market: 'bars', expense: 'bolt', charity: 'heart', payday: 'payday', baby: 'baby', taxquiz: 'taxquiz' };
const SQ_COLOR = { payday: 0xE3A83A, opportunity: 0x3FBF8E, expense: 0xDD4A44, market: 0x3F93E8, taxquiz: 0x2A938C, baby: 0xEF8ABB, charity: 0x8B6BEF };
function ringPos(i) {

 if (i <= 12) return [6,i-4];
 if (i <= 17) return [18-i,8];
 return [1,25-i];
}
const T = 1.0, GAP = 0.14, PITCH = T + GAP;           // tile + gap
const SPAN = 6 * T + 5 * GAP;                          // 7.84
const SLAB = SPAN + 1.15; const DEPTH = 8 * T + 7 * GAP + 1.15;                              // board slab width
const board = new THREE.Group(); scene.add(board);

// slab: thick navy board with gold rim
const slab = S(new THREE.Mesh(new RoundedBoxGeometry(SLAB, 0.42, DEPTH, 4, 0.12), M(0x14203C, 0.55)));
slab.position.y = -0.21; board.add(slab);
const rimT = 0.07;
const rimOuter = S(new THREE.Mesh(new RoundedBoxGeometry(SLAB + rimT * 2, 0.18, DEPTH + rimT * 2, 4, 0.09), M(0xC89B2E, 0.35, 0.55)));
rimOuter.position.y = -0.33; board.add(rimOuter);

const felt = S(new THREE.Mesh(new RoundedBoxGeometry(SPAN + 0.9, 0.06, DEPTH - 0.25, 3, 0.05), M(0x0E1830, 0.85)));

// tiles
const tileGeoCache = {};
function tileMesh(color) {
  const plate = S(new THREE.Mesh(new RoundedBoxGeometry(T, 0.1, T, 3, 0.045), M(0xEFE4C8, 0.5)));
  plate.position.y = 0.05;
  const face = S(new THREE.Mesh(new RoundedBoxGeometry(T - 0.13, 0.06, T - 0.13, 3, 0.03), M(color, 0.42)));
  face.position.y = 0.1;
  const g = new THREE.Group(); g.add(plate); g.add(face);
  return g;
}

const PIECE_SCALE = 0.56;
const tileAt = {};
BOARD.forEach((sq, i) => {
  const [col, row] = ringPos(i);
  const x = (col - 3.5) * PITCH, z = (row - 4.5) * PITCH;
  const t = tileMesh(SQ_COLOR[sq]);
  t.position.set(x, 0, z); board.add(t);
  const p = PIECES[PIECE_FILE[sq]]();
  p.scale.setScalar(PIECE_SCALE);
  // face outward from board centre
  p.rotation.y = 0.16 + ((i * 37) % 11 - 5) * 0.03; // mostly facing camera, slight variety
  p.position.set(x, 0.13, z);
  board.add(p);
  tileAt[i] = { x, z };

// camera: table angle, slight yaw
const yaw = 0.035, elev = 0.85, dist = 25.8;
camera.position.set(Math.sin(yaw) * Math.cos(elev) * dist, Math.sin(elev) * dist, Math.cos(yaw) * Math.cos(elev) * dist);

window.__geo = () => {
  const proj = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x + 1) / 2 * SIZE, (1 - v.y) / 2 * SIZE]; };

    const { x, z } = tileAt[i];

    const [ax] = proj(x + 0.5, 0.14, z); const [, by] = proj(x, 0.14, z + 0.5);

  });
