<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פסיבו – מסך פתיחה (v3 Navy &amp; Gold)</title>
<link rel="stylesheet" href="../../src/styles/fonts.css">
<link rel="stylesheet" href="../../src/styles/tokens.css">
<link rel="stylesheet" href="./v3.css">
</head>
<body>
<div>
<p class="cap">Start / 360x800 - tired fox idle (wave pose plays once on first launch)</p>
<div class="frame" style="background:var(--grad-sky)">
  <!-- stars + skyline -->
  <svg class="abs" style="inset:0" width="360" height="800" viewBox="0 0 360 800" aria-hidden="true">
    <g fill="#fff"><circle cx="34" cy="64" r="1.6" opacity=".9"/><circle cx="100" cy="38" r="1.1" opacity=".7"/><circle cx="160" cy="88" r="1.8" opacity=".8"/><circle cx="236" cy="50" r="1.3" opacity=".9"/><circle cx="310" cy="82" r="1.7" opacity=".7"/><circle cx="334" cy="34" r="1.2" opacity=".8"/><circle cx="70" cy="140" r="1.2" opacity=".6"/><circle cx="288" cy="138" r="1.4" opacity=".6"/></g>
    <g fill="var(--skyline)" opacity=".95"><rect x="0" y="690" width="32" height="110"/><rect x="36" y="660" width="24" height="140"/><rect x="64" y="704" width="38" height="96"/><rect x="106" y="642" width="28" height="158"/><rect x="138" y="696" width="34" height="104"/><rect x="176" y="676" width="22" height="124"/><rect x="202" y="708" width="40" height="92"/><rect x="246" y="650" width="26" height="150"/><rect x="276" y="700" width="36" height="100"/><rect x="316" y="668" width="44" height="132"/></g>
    <g fill="var(--skyline-window)" opacity=".9"><rect x="42" y="672" width="4" height="5"/><rect x="48" y="686" width="4" height="5"/><rect x="112" y="656" width="4" height="5"/><rect x="120" y="674" width="4" height="5"/><rect x="252" y="664" width="4" height="5"/><rect x="258" y="682" width="4" height="5"/><rect x="326" y="682" width="4" height="5"/><rect x="340" y="700" width="4" height="5"/></g>
  </svg>
  <div class="abs" style="inset-inline:0;top:14px;padding:0 16px;display:flex;justify-content:space-between;align-items:center">
    <div class="glass" style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:22px;font-weight:700;font-size:15px"><img class="coin" src="../../src/assets/coin-small.svg" alt="" width="22" height="22"><span>12 משחקים</span></div>
    <button class="icon-btn" aria-label="הגדרות"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="abs" style="inset-inline:0;top:76px;display:flex;justify-content:center"><img src="../../src/assets/wordmark.svg" alt="פסיבו Passivo" width="232" style="filter:drop-shadow(0 8px 14px rgb(0 0 0/.4))"></div>
  <p class="abs" style="inset-inline:24px;top:212px;margin:0;text-align:center;font-size:17px;font-weight:500;line-height:1.4;color:var(--text-soft)">הכסף עובד בשבילך. אתם רק צריכים להתחיל.</p>
  <!-- fox hero 250px tall, centred, halo behind -->
  <div class="abs halo" style="width:330px;height:330px;inset-inline-start:0;top:246px"></div>
  <img class="abs bob" src="../../src/assets/fox/tired@2x.webp" alt="פסיבו השועל, עייף עם קפה" style="height:296px;width:auto;inset-inline-start:30px;top:262px;filter:drop-shadow(0 14px 18px rgb(0 0 0/.45))">
  <div class="bubble" style="inset-inline-end:16px;top:300px;width:116px;font-size:14px;border-end-end-radius:4px">עוד יום בשגרה... בואו נשנה את זה</div>
  <div class="abs" style="inset-inline:16px;bottom:28px;display:flex;flex-direction:column;gap:12px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="btn" style="min-height:72px;padding:10px 12px;border-radius:20px;border:2px solid var(--c-gold-400);background:rgb(242 181 58/.18);color:#fff;flex-direction:column;align-items:flex-start;gap:2px;font-family:inherit"><b style="font-size:18px">משפחה</b><span style="font-size:13px;color:var(--text-soft)">מגיל 9 · דירות ועסקים</span></button>
      <button class="btn" style="min-height:72px;padding:10px 12px;border-radius:20px;border:2px solid rgb(255 255 255/.25);background:var(--glass-bg);color:#fff;flex-direction:column;align-items:flex-start;gap:2px;font-family:inherit"><b style="font-size:18px">מלא</b><span style="font-size:13px;color:var(--text-muted)">מניות, מכירה והלוואות</span></button>
    </div>
    <button class="btn btn-primary"><span>התחילו משחק</span><svg class="icon-dir" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A1700" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:scaleX(1)"><path d="M15 5l-7 7 7 7"/></svg></button>
  </div>
</div>
</div>
</body>
</html>
